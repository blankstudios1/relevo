<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Um Quiz Só Para Ti</title>
<meta name="description" content="Um pequeno quiz de casal com pinguins, com uma surpresa no final." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="curtain-rod"></div>
  <div class="curtain-panel curtain-left"><div class="curtain-fringe"></div></div>
  <div class="curtain-panel curtain-right"><div class="curtain-fringe"></div></div>
</div>

<canvas id="confetti-canvas"></canvas>

<main class="stage">
  <div class="brand"><span class="dot"></span> Colónia de Dois</div>

  <div class="progress" id="progress" hidden></div>

  <div class="mascots" id="mascots">
    <svg class="penguin-blue" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="60" cy="126" rx="26" ry="8" fill="#000" opacity="0.08"/>
      <ellipse cx="34" cy="112" rx="12" ry="7" fill="#f4a340"/>
      <ellipse cx="86" cy="112" rx="12" ry="7" fill="#f4a340"/>
      <path d="M60 18c26 0 42 22 42 52s-16 52-42 52-42-22-42-52 16-52 42-52z" fill="var(--penguin-blue, #3e86c9)"/>
      <path d="M60 42c15 0 25 16 25 40s-10 38-25 38-25-14-25-38 10-40 25-40z" fill="#fdfdfd"/>
      <ellipse cx="28" cy="70" rx="9" ry="22" fill="var(--penguin-blue, #3e86c9)" transform="rotate(-18 28 70)"/>
      <ellipse cx="92" cy="70" rx="9" ry="22" fill="var(--penguin-blue, #3e86c9)" transform="rotate(18 92 70)"/>
      <circle cx="48" cy="46" r="5" fill="#16263a"/>
      <circle cx="72" cy="46" r="5" fill="#16263a"/>
      <circle cx="49.5" cy="44.5" r="1.4" fill="#fff"/>
      <circle cx="73.5" cy="44.5" r="1.4" fill="#fff"/>
      <ellipse cx="40" cy="55" rx="5" ry="3" fill="#ff9d81" opacity="0.55"/>
      <ellipse cx="80" cy="55" rx="5" ry="3" fill="#ff9d81" opacity="0.55"/>
      <path d="M52 54c3 4 13 4 16 0-2 6-14 6-16 0z" fill="#f4a340"/>
    </svg>
    <svg class="penguin-pink" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="60" cy="126" rx="26" ry="8" fill="#000" opacity="0.08"/>
      <ellipse cx="34" cy="112" rx="12" ry="7" fill="#f4a340"/>
      <ellipse cx="86" cy="112" rx="12" ry="7" fill="#f4a340"/>
      <path d="M60 18c26 0 42 22 42 52s-16 52-42 52-42-22-42-52 16-52 42-52z" fill="var(--penguin-pink, #f3a0c2)"/>
      <path d="M60 42c15 0 25 16 25 40s-10 38-25 38-25-14-25-38 10-40 25-40z" fill="#fffdfd"/>
      <ellipse cx="28" cy="70" rx="9" ry="22" fill="var(--penguin-pink, #f3a0c2)" transform="rotate(-18 28 70)"/>
      <ellipse cx="92" cy="70" rx="9" ry="22" fill="var(--penguin-pink, #f3a0c2)" transform="rotate(18 92 70)"/>
      <path d="M40 24c4-8 16-10 22-4-8-2-16 0-22 4z" fill="#d97aa3"/>
      <circle cx="48" cy="46" r="5" fill="#16263a"/>
      <circle cx="72" cy="46" r="5" fill="#16263a"/>
      <circle cx="49.5" cy="44.5" r="1.4" fill="#fff"/>
      <circle cx="73.5" cy="44.5" r="1.4" fill="#fff"/>
      <path d="M42 39l4 3M46 38l2 4" stroke="#16263a" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M78 39l-4 3M74 38l-2 4" stroke="#16263a" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="40" cy="55" rx="5" ry="3" fill="#ff8fae" opacity="0.6"/>
      <ellipse cx="80" cy="55" rx="5" ry="3" fill="#ff8fae" opacity="0.6"/>
      <path d="M52 54c3 4 13 4 16 0-2 6-14 6-16 0z" fill="#f4a340"/>
    </svg>
  </div>

  <div class="speech" id="speech">Psiu... tenho aqui um quiz só para ti.</div>

  <section class="card" id="card">
    <!-- filled by script.js -->
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
