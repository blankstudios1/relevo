<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Um Quiz Só Para Ti</title>
<meta name="description" content="Um pequeno quiz de casal com pinguins, com uma surpresa no final." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="curtain-rod"></div>
  <div class="curtain-panel curtain-left"><div class="curtain-fringe"></div></div>
  <div class="curtain-panel curtain-right"><div class="curtain-fringe"></div></div>
</div>

<canvas id="confetti-canvas"></canvas>

<main class="stage">
  <div class="brand"><span class="dot"></span> Colónia de Dois</div>

  <div class="progress" id="progress" hidden></div>

  <div class="mascots" id="mascots">
    <svg class="mascot-pair" viewBox="0 0 240 148" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <ellipse cx="120" cy="138" rx="100" ry="8" fill="#000" opacity="0.08"/>

      <g transform="translate(120,0)">
        <g class="penguin-pink">
          <ellipse cx="34" cy="114" rx="12" ry="7" fill="#f4a340"/>
          <ellipse cx="86" cy="114" rx="12" ry="7" fill="#f4a340"/>
          <path d="M60 12c27 0 44 23 44 54s-17 54-44 54-44-23-44-54 17-54 44-54z" fill="var(--penguin-pink, #f3a0c2)"/>
          <path d="M60 38c16 0 26 16 26 41s-10 39-26 39-26-14-26-39 10-41 26-41z" fill="#fffdfd"/>
          <path d="M42 18c4-9 16-11 23-4-9-2-16 0-23 4z" fill="#d97aa3"/>
          <ellipse cx="28" cy="68" rx="9.5" ry="23" fill="var(--penguin-pink, #f3a0c2)" transform="rotate(-16 28 68)"/>
          <circle cx="48" cy="44" r="5.3" fill="#16263a"/>
          <circle cx="73" cy="44" r="5.3" fill="#16263a"/>
          <circle cx="49.6" cy="42.3" r="1.5" fill="#fff"/>
          <circle cx="74.6" cy="42.3" r="1.5" fill="#fff"/>
          <path d="M42 37l4 3M46 36l2 4" stroke="#16263a" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M79 37l-4 3M75 36l-2 4" stroke="#16263a" stroke-width="1.3" stroke-linecap="round"/>
          <ellipse cx="40" cy="54" rx="5" ry="3" fill="#ff8fae" opacity="0.6"/>
          <ellipse cx="81" cy="54" rx="5" ry="3" fill="#ff8fae" opacity="0.6"/>
          <path d="M52 53c3 4 13 4 16 0-2 6-14 6-16 0z" fill="#f4a340"/>
        </g>
      </g>

      <g class="penguin-blue">
        <ellipse cx="34" cy="114" rx="12" ry="7" fill="#f4a340"/>
        <ellipse cx="86" cy="114" rx="12" ry="7" fill="#f4a340"/>
        <path d="M60 12c27 0 44 23 44 54s-17 54-44 54-44-23-44-54 17-54 44-54z" fill="var(--penguin-blue, #3e86c9)"/>
        <path d="M60 38c16 0 26 16 26 41s-10 39-26 39-26-14-26-41 10-41 26-41z" fill="#fdfdfd"/>
        <path d="M46 15c1-10 12-14 18-9-8 0-15 4-18 9z" fill="#2c6098"/>
        <ellipse cx="24" cy="68" rx="9.5" ry="23" fill="var(--penguin-blue, #3e86c9)" transform="rotate(-16 24 68)"/>
        <path d="M92 58c15 2 26 14 25 29-1 11-11 17-21 13-8-3-11-15-8-25 2-7 2-13 4-17z" fill="var(--penguin-blue, #3e86c9)"/>
        <circle cx="47" cy="44" r="5.3" fill="#16263a"/>
        <circle cx="72" cy="44" r="5.3" fill="#16263a"/>
        <circle cx="48.6" cy="42.3" r="1.5" fill="#fff"/>
        <circle cx="73.6" cy="42.3" r="1.5" fill="#fff"/>
        <ellipse cx="39" cy="54" rx="5" ry="3" fill="#ff9d81" opacity="0.55"/>
        <ellipse cx="80" cy="54" rx="5" ry="3" fill="#ff9d81" opacity="0.55"/>
        <path d="M51 53c3 4 13 4 16 0-2 6-14 6-16 0z" fill="#f4a340"/>
      </g>
    </svg>
  </div>

  <div class="speech" id="speech">Psiu... tenho aqui um quiz só para ti.</div>

  <section class="card" id="card">
    <!-- filled by script.js -->
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
